spring.application.name=mysawit-harvest-service
server.port=8083

# Supabase Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Supabase S3 Configuration
supabase.storage.endpoint=${SUPABASE_ENDPOINT}
supabase.storage.region=${SUPABASE_REGION:ap-southeast-1}
supabase.storage.access-key=${SUPABASE_ACCESS_KEY}
supabase.storage.secret-key=${SUPABASE_SECRET_KEY}
supabase.storage.bucket-name=${SUPABASE_BUCKET:harvest-photos}

# JPA Database Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Security & Monitoring Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# RabbitMQ & CloudAMQP Configuration
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:true}

# User event consumers (bounded to Identity's user.exchange) Configuration
harvest.rabbitmq.exchange.user=user.exchange
harvest.rabbitmq.routing-key.user-registered=user.registered
harvest.rabbitmq.routing-key.user-assigned=user.assignment.*
harvest.rabbitmq.queues.user-registered=harvest.user.registered.queue
harvest.rabbitmq.queues.user-assigned=harvest.user.assigned.queue
harvest.rabbitmq.queues.user-deleted=harvest.user.deleted.queue

# JWT Configuration
jwt.secret=${JWT_SECRET}

# Identity Module Configuration
services.identity.url=${IDENTITY_SERVICE_URL}
services.identity.internal-api-key=${IDENTITY_INTERNAL_API_KEY}


