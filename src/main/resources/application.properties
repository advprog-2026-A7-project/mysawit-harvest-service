spring.application.name=mysawit-harvest-service
server.port=8083

# Supabase Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA Database Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Security & Monitoring Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:true}

# JWT Configuration
jwt.secret=${JWT_SECRET}

# Identity Module Configuration
services.identity.url=${IDENTITY_SERVICE_URL}
services.identity.internal-api-key=${IDENTITY_INTERNAL_API_KEY}

# User-event consumers (bound to Identity's user.exchange)
harvest.rabbitmq.exchange.user=user.exchange
harvest.rabbitmq.routing-key.user-registered=user.registered
harvest.rabbitmq.routing-key.user-assigned=user.assigned
harvest.rabbitmq.queues.user-registered=harvest.user.registered.queue
harvest.rabbitmq.queues.user-assigned=harvest.user.assigned.queue
