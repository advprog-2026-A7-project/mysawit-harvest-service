name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Harvest Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew assemble -x test

      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "build/libs/*.jar,Dockerfile,docker-compose.yml,monitoring/"
          target: "~/mysawit-harvest"
          strip_components: 0

      - name: Build and Run Container
        uses: appleboy/ssh-action@master
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_VHOST: ${{ secrets.RABBITMQ_VHOST }}
          IDENTITY_SERVICE_URL: ${{ secrets.IDENTITY_SERVICE_URL }}
          IDENTITY_INTERNAL_API_KEY: ${{ secrets.IDENTITY_INTERNAL_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,RABBITMQ_HOST,RABBITMQ_USERNAME,RABBITMQ_PASSWORD,RABBITMQ_VHOST,IDENTITY_SERVICE_URL,IDENTITY_INTERNAL_API_KEY,JWT_SECRET,CORS_ORIGINS,GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD
          script: |
            cd ~/mysawit-harvest
            
            sudo docker stop harvest-service || true
            sudo docker rm harvest-service || true
            
            sudo docker build -t mysawit-harvest .
            
            echo "SPRING_DATASOURCE_URL=$SPRING_DATASOURCE_URL" > .env
            echo "SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME" >> .env
            echo "SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD" >> .env
            echo "RABBITMQ_HOST=$RABBITMQ_HOST" >> .env
            echo "RABBITMQ_USERNAME=$RABBITMQ_USERNAME" >> .env
            echo "RABBITMQ_PASSWORD=$RABBITMQ_PASSWORD" >> .env
            echo "RABBITMQ_VHOST=$RABBITMQ_VHOST" >> .env
            echo "IDENTITY_SERVICE_URL=$IDENTITY_SERVICE_URL" >> .env
            echo "IDENTITY_INTERNAL_API_KEY=$IDENTITY_INTERNAL_API_KEY" >> .env
            echo "JWT_SECRET=$JWT_SECRET" >> .env
            echo "CORS_ORIGINS=$CORS_ORIGINS" >> .env
            echo "GRAFANA_ADMIN_USER=$GRAFANA_ADMIN_USER" >> .env
            echo "GRAFANA_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD" >> .env
            
            sudo docker run -d \
              --name harvest-service \
              --network host \
              --env-file .env \
              --restart unless-stopped \
              mysawit-harvest
            
            sudo docker compose up -d

      - name: Verify Health
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            echo "Waiting for service to be healthy..."
            for i in {1..20}; do
              if curl -s http://localhost:8083/actuator/health | grep "UP"; then
                echo "Service is UP!"
                exit 0
              fi
              echo "Retrying in 5s..."
              sleep 5
            done
            sudo docker logs harvest-service
            exit 1