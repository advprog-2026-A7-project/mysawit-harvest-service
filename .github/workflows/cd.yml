name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Harvest Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew assemble -x test

      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "build/libs/*.jar,Dockerfile"
          target: "~/mysawit-harvest"
          strip_components: 0

      - name: Build and Run Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ~/mysawit-harvest
            
            if ! command -v docker &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y docker.io
            fi

            sudo docker stop harvest-service || true
            sudo docker rm harvest-service || true

            sudo docker build -t mysawit-harvest .

            sudo docker run -d \
              --name harvest-service \
              -p ${{ vars.HARVEST_HOST_PORT || 8083 }}:8083 \
              -e SPRING_DATASOURCE_URL='${{ secrets.SPRING_DATASOURCE_URL }}' \
              -e SPRING_DATASOURCE_USERNAME='${{ secrets.SPRING_DATASOURCE_USERNAME }}' \
              -e SPRING_DATASOURCE_PASSWORD='${{ secrets.SPRING_DATASOURCE_PASSWORD }}' \
              -e RABBITMQ_USERNAME='${{ secrets.RABBITMQ_USERNAME }}' \
              -e RABBITMQ_PASSWORD='${{ secrets.RABBITMQ_PASSWORD }}' \
              -e CORS_ORIGINS='${{ secrets.CORS_ORIGINS }}' \
              --restart unless-stopped \
              mysawit-harvest

      - name: Verify Health
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            echo "Waiting for service to be healthy..."
            for i in {1..20}; do
              if curl -s http://localhost:8083/actuator/health | grep "UP"; then
                echo "Service is UP!"
                exit 0
              fi
              echo "Retrying in 5s..."
              sleep 5
            done
            sudo docker logs harvest-service
            exit 1